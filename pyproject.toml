[tool.ruff]
# Target strict compliance with 90 columns limit for adaptive readability
line-length = 90

[tool.ruff.lint]
# Active code rule directories for Aegis
# E: Syntax & Style Errors, W: Style Warnings, F: Pyflakes, I: Isort, D: Docstrings
select = ["E", "W", "F", "I", "D"]
ignore = [
    "D100",  # Missing docstring in public module (we handle via file headers)
    "D104",  # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
# Enforce strict Google Style Docstrings as validated in architecture
convention = "google"

[tool.ruff.lint.isort]
# Force strict 3-tier import splitting rules (Standard -> Third-Party -> Local)
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["core", "strategies", "brokers"]
force-single-line = true
