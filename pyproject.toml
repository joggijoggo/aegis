[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-framework"
version = "1.0.0"
description = "High-performance multi-asset algorithmic trading execution framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=core --cov=strategies --cov=bots --cov=market_feeds --cov=broker_adapters --cov-report term-missing --cov-report html"
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning"
]

[tool.coverage.run]
source = [
    "core",
    "strategies",
    "bots",
    "market_feeds",
    "broker_adapters"
]
omit = [
    "tests/*",
    "**/test_*.py"
]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
